name: Save system regression
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  saves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest hypothesis
      - run: python -m pytest -q tests/test_save_system.py
